[project]
name = "attendance-bot"
version = "0.1.0"
description = "Telegram attendance bot"
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiogram>=3.20,<4.0",
    "aiosqlite>=0.21,<1.0",
    "alembic>=1.16,<2.0",
    "dishka>=1.6,<2.0",
    "greenlet>=3.2,<4.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0.41,<3.0",
    "structlog>=25.4,<26.0",
    "google-api-python-client (>=2.0,<3.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<9.0"
pytest-asyncio = ">=1.0,<2.0"
ruff = ">=0.12,<1.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
