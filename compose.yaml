x-app: &app
  build:
    context: .
  env_file:
    - .env
  environment:
    DATABASE_URL: sqlite+aiosqlite:////data/attendance.db
    BACKUP_DIR: /backups
  volumes:
    - ./runtime:/data
    - ./backups:/backups
    - ./secrets:/app/secrets:ro
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  bootstrap-roles:
    <<: *app
    command: ["python", "-m", "bootstrap_roles"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  telegram-bot:
    <<: *app
    command: ["python", "-m", "telegram_main"]
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "observability.healthcheck", "--service", "telegram-bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  vk-bot:
    <<: *app
    command: ["python", "-m", "vk_main"]
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "observability.healthcheck", "--service", "vk-bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "sync_worker"]
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "observability.healthcheck", "--service", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  notification-worker:
    <<: *app
    command: ["python", "-m", "notification_worker"]
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "observability.healthcheck", "--service", "notification-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backup:
    <<: *app
    command: ["python", "-m", "backup", "--loop"]
    depends_on:
      bootstrap-roles:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "observability.healthcheck", "--service", "backup"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
